# y-cluster dockerhost guest. See DOCKERHOST.md in y-cluster.
#
# Every k3s-in-docker cluster (y-cluster's docker provisioner, kind,
# k3d) runs a kubelet and a containerd in its container, and with them
# the pods' watchers, all from the guest's single inotify budget.
# Ubuntu's defaults (128 instances, watches scaled from memory, about
# 46000 in a 6 GB guest) are below the 256 instances the docker
# provisioner requires. These are the values GitHub's ubuntu runners
# set, where y-cluster's docker e2e runs in CI.
fs.inotify.max_user_instances = 1280
fs.inotify.max_user_watches = 655360
